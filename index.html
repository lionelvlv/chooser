<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chooser">
<meta name="theme-color" content="#0b0a10">
<title>Finger Chooser</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: one full-bleed touch canvas; centered hint at rest; a mode pill floats top-right */
:root{
  --bg:#0b0a10; --fg:#f3f1f8; --dim:#8b889a; --pill:#1b1a24; --pill-line:#2f2c3d;
  --font:ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;overscroll-behavior:none}
body{
  background:var(--bg);color:var(--fg);font-family:var(--font);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;
}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#hint{position:fixed;inset:0;display:grid;place-content:center;gap:10px;text-align:center;pointer-events:none;
  padding-inline:max(24px,env(safe-area-inset-left,0px));transition:opacity .25s}
#hint h1{margin:0;font-size:clamp(28px,7.5vw,46px);font-weight:700;letter-spacing:-.015em;line-height:1.1;text-wrap:balance}
#hint p{margin:0;font-size:16px;color:var(--dim);text-wrap:balance}
#mode{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 16px);
  font:600 15px/1 var(--font);color:var(--fg);background:var(--pill);border:1px solid var(--pill-line);
  border-radius:999px;padding:11px 16px;cursor:pointer;transition:opacity .2s}
#mode:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
#mode:disabled,#dare:disabled{opacity:0}
#dare{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);left:calc(env(safe-area-inset-left,0px) + 16px);
  font:600 15px/1 var(--font);color:var(--fg);background:var(--pill);border:1px solid var(--pill-line);
  border-radius:999px;padding:11px 16px;cursor:pointer;transition:opacity .2s}
#dare:focus-visible{outline:2px solid var(--fg);outline-offset:3px}
#card{position:fixed;left:50%;width:min(420px,calc(100% - 40px));transform:translate(-50%,12px);opacity:0;
  background:var(--bg);color:var(--fg);border-radius:22px;padding:20px 22px 18px;pointer-events:none;
  box-shadow:0 18px 50px rgba(0,0,0,.45);transition:opacity .3s,transform .3s;display:grid;gap:8px}
#card.show{opacity:1;transform:translate(-50%,0)}
#card.top{top:calc(env(safe-area-inset-top,0px) + 70px)}
#card.bottom{bottom:calc(env(safe-area-inset-bottom,0px) + 28px)}
#card .kind{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase}
#card .text{font-size:21px;font-weight:600;line-height:1.3;text-wrap:pretty}
#card .out{font-size:15px;font-weight:700;color:var(--fg)}
#card .next{font-size:14px;color:var(--dim)}
@media (prefers-reduced-motion:reduce){#hint{transition:none}}
</style>

<canvas id="c"></canvas>
<div id="hint"><h1>Everyone put a finger down</h1><p id="sub">Hold still. Someone is about to get picked.</p></div>
<button id="mode" type="button">Pick 1</button>
<button id="dare" type="button">Dares off</button>
<div id="card" aria-live="polite"><div class="kind"></div><div class="text"></div><div class="out">Won't do it? Take a drink.</div><div class="next">Lift fingers, then tap for the next round</div></div>

<script>
const cv=document.getElementById('c'), ctx=cv.getContext('2d');
const hint=document.getElementById('hint'), sub=document.getElementById('sub'), modeBtn=document.getElementById('mode');
const BG='#0b0a10';
const COLORS=['#ff3b5c','#ffb000','#2bd96b','#20b8ff','#a66bff','#ff6bd6','#ff7a1a','#00e0c6','#e3ff3a','#6b8cff'];
const TEAM=['#ff3b5c','#20b8ff'];
const MODES=[
  {label:'Pick 1',n:1,sub:'Hold still. Someone is about to get picked.'},
  {label:'Pick 2',n:2,sub:'Hold still. Two people get picked.'},
  {label:'Pick 3',n:3,sub:'Hold still. Three people get picked.'},
  {label:'2 teams',teams:true,sub:'Hold still. Everyone gets split into two teams.'},
];
const TRUTHS=["What is your body count?", "Who in this room would you hook up with?", "What is the most embarrassing thing you have done drunk?", "Describe your worst hookup in detail.", "Have you ever hooked up with someone in this room?", "What is the weirdest place you have hooked up?", "Who was the last person you drunk texted, and what did you say?", "Rate the person on your left out of 10. Be honest.", "Have you ever been walked in on?", "What is your biggest turn-off?", "What is the most humiliating thing that has happened to you at a party?", "Have you ever cheated on someone?", "What is the most embarrassing thing in your search history?", "What is the longest you have gone without hooking up?", "Who here do you think is the worst kisser?", "Have you ever thrown up in public? Where?", "What is a secret you have never told anyone in this room?", "What is your worst walk of shame story?", "Who is your current situationship?", "What is the most embarrassing thing your parents caught you doing?", "What do you actually think of the person on your right?", "What is the dumbest thing you did to impress a crush?", "Have you ever peed somewhere you really should not have?", "What is the most embarrassing photo in your camera roll?", "If you had to date someone here, who would it be?", "What is the worst pickup line you have actually used?", "Who here would you never hook up with, even drunk?", "What is the most you have spent on a night you do not remember?", "Have you ever sent a text to the wrong person? What did it say?", "What is your weirdest fantasy?", "Who was your most regrettable kiss?", "Have you ever faked being sick to get out of a date?", "What is the most embarrassing way you have been rejected?", "What is a lie you told to get someone into bed?", "Which ex do you still stalk on social media?", "What is the worst thing you have done to a roommate?", "Have you ever woken up not knowing where you were?", "Who in this room have you talked about behind their back?", "What is the most embarrassing thing you have said during a hookup?", "Have you ever hooked up with someone and forgotten their name?"];
const DARES=["Let the group send a text from your phone to anyone they choose.", "Post a selfie the group picks on your story for 10 minutes.", "Call an ex and keep them on the line for 30 seconds.", "Let the person on your left scroll your camera roll for 30 seconds.", "Read your last 5 DMs out loud.", "Do a body shot off a willing volunteer.", "Take a shot with no chaser.", "Kiss the person the group picks, if they agree. Otherwise drink twice.", "Give a chair a dramatic lap dance for 30 seconds.", "Twerk for 20 seconds.", "Show everyone your screen time report.", "Swap shirts with the person across from you.", "Change your Instagram bio to whatever the group picks for 24 hours.", "Do your best fake moan for 10 seconds.", "Text your crush \"thinking about you\" right now.", "Like the oldest photo on your crush's Instagram.", "Let the group write your next dating app prompt.", "Play the rest of the round shirtless, or drink twice.", "Sit on the lap of the person on your left until your next turn, if they agree.", "Chug your drink.", "Take a sip from everyone's drink.", "Talk in a baby voice until your next turn.", "Send a voice memo of you singing to the fifth person in your contacts.", "Show your recent search history.", "Reenact your last hookup with a pillow.", "Take off one item of clothing, or drink.", "Let someone post a story from your phone.", "Take your socks off as a slow striptease.", "Recreate your most-liked Instagram post right now.", "Whisper something flirty in the ear of the person on your right.", "Let the group read the last 3 notes in your notes app.", "Put an ice cube down your shirt and let it melt.", "Let the group go through your Hinge or Tinder for one minute.", "Do 10 pushups with someone sitting on your back.", "Let the person on your right draw on your face with a pen.", "Act out your sex face for the group.", "Send \"we need to talk\" to the third person in your recent chats and wait 2 minutes before explaining.", "Show the last photo you sent someone.", "Lick the hand of the person on your left, if they agree.", "Let the group pick your next drink and finish it."];
const DARE_MODES=['Dares off','Truth or dare','Truth','Dare'];
let di=0; try{di=+localStorage.getItem('chooser-dare')||0}catch(e){}
if(!DARE_MODES[di])di=0;
const dareBtn=document.getElementById('dare'), card=document.getElementById('card');
const cardKind=card.querySelector('.kind'), cardText=card.querySelector('.text');
dareBtn.textContent=DARE_MODES[di];
dareBtn.addEventListener('click',()=>{
  if(state!=='idle'||fingers.size)return;
  di=(di+1)%DARE_MODES.length; dareBtn.textContent=DARE_MODES[di];
  try{localStorage.setItem('chooser-dare',di)}catch(e){}
});
const lastPick={Truth:-1,Dare:-1};
function dealCard(w){
  const kind=di===1?(Math.random()<.5?'Truth':'Dare'):DARE_MODES[di];
  const list=kind==='Truth'?TRUTHS:DARES;
  let i; do{i=Math.random()*list.length|0}while(i===lastPick[kind]&&list.length>1);
  lastPick[kind]=i;
  cardKind.textContent=kind; cardKind.style.color=w.color; cardText.textContent=list[i];
  card.className=w.y>H/2?'top':'bottom';
  setTimeout(()=>{if(state==='chosen')card.classList.add('show')},650);
}
let tapToReset=false;
const DELAY=2600, R=44;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;

let mi=0; try{mi=+localStorage.getItem('chooser-mode')||0}catch(e){}
if(!MODES[mi])mi=0;
const mode=()=>MODES[mi];
function showMode(){modeBtn.textContent=mode().label;sub.textContent=mode().sub}
showMode();
modeBtn.addEventListener('click',()=>{
  if(state!=='idle'||fingers.size)return;
  mi=(mi+1)%MODES.length; showMode();
  try{localStorage.setItem('chooser-mode',mi)}catch(e){}
});

let W=0,H=0;
function resize(){
  const d=Math.min(devicePixelRatio||1,3); W=innerWidth; H=innerHeight;
  cv.width=W*d; cv.height=H*d; ctx.setTransform(d,0,0,d,0,0);
}
addEventListener('resize',resize); resize();

const fingers=new Map(); // pointerId -> {x,y,color,born,phase,down,out,win,lose}
let state='idle', deadline=0, chosenAt=0, winners=[], resetAt=0;
const need=()=>mode().teams?2:mode().n+1;
const active=()=>[...fingers.values()].filter(f=>f.down);

function freeColor(){
  const used=new Set([...fingers.values()].map(f=>f.color));
  const pool=COLORS.filter(c=>!used.has(c));
  const p=pool.length?pool:COLORS; return p[Math.random()*p.length|0];
}
function recount(now){
  if(state==='chosen')return;
  if(active().length>=need()){state='counting';deadline=now+DELAY}else state='idle';
}
function choose(now){
  const ls=active();
  for(let i=ls.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ls[i],ls[j]]=[ls[j],ls[i]]}
  if(mode().teams){ls.forEach((f,i)=>{f.color=TEAM[i%2];f.win=true});winners=[]}
  else{winners=ls.slice(0,mode().n);winners.forEach(f=>f.win=true);ls.slice(mode().n).forEach(f=>f.lose=true)}
  state='chosen'; chosenAt=now; modeBtn.disabled=dareBtn.disabled=true;
  if(di&&winners.length)dealCard(winners[0]);
}

let wake=null;
async function keepAwake(){try{if(!wake&&navigator.wakeLock){wake=await navigator.wakeLock.request('screen');wake.addEventListener('release',()=>wake=null)}}catch(e){}}

cv.addEventListener('pointerdown',e=>{
  e.preventDefault(); keepAwake();
  const now=performance.now();
  if(tapToReset){reset();return}
  if(state==='chosen')return; // late fingers sit this round out
  try{cv.setPointerCapture(e.pointerId)}catch(_){}
  fingers.set(e.pointerId,{x:e.clientX,y:e.clientY,color:freeColor(),born:now,phase:Math.random()*6,down:true,out:0});
  modeBtn.disabled=dareBtn.disabled=true; recount(now);
});
cv.addEventListener('pointermove',e=>{
  const f=fingers.get(e.pointerId); if(f&&f.down){f.x=e.clientX;f.y=e.clientY}
});
function lift(e){
  const f=fingers.get(e.pointerId); if(!f||!f.down)return;
  const now=performance.now(); f.down=false;
  if(state==='chosen'){
    if(!active().length){
      if(card.textContent&&di&&winners.length){tapToReset=true}
      else resetAt=Math.max(now+500,chosenAt+1600);
    }
  }else{f.out=now;recount(now)}
}
cv.addEventListener('pointerup',lift);
cv.addEventListener('pointercancel',lift);
cv.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('touchmove',e=>e.preventDefault(),{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());

const easeOut=t=>1-Math.pow(1-t,3);
const easeBack=t=>{const c=1.7;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2)};
function disc(x,y,r){ctx.beginPath();ctx.arc(x,y,Math.max(0,r),0,Math.PI*2)}

function drawFinger(f,now){
  let a=1;
  if(f.out){a=1-(now-f.out)/220;if(a<=0){fingers.delete(f.id);return false}}
  if(f.lose){a=1-(now-chosenAt)/320;if(a<=0)return true}
  const grow=easeBack(Math.min(1,(now-f.born)/280));
  const prog=state==='counting'?Math.min(1,1-(deadline-now)/DELAY):0;
  const speed=170-90*prog;
  const pulse=reduce?1:1+(f.win&&!mode().teams?0.04:0.07)*Math.sin(now/speed+f.phase);
  const r=R*grow*pulse*(f.win&&!mode().teams?1.15:1);
  ctx.globalAlpha=Math.max(0,a);
  ctx.fillStyle=f.color; disc(f.x,f.y,r*0.7); ctx.fill();
  ctx.strokeStyle=f.color; ctx.lineWidth=7; disc(f.x,f.y,r); ctx.stroke();
  if(prog>0){
    ctx.lineWidth=4; ctx.lineCap='round'; ctx.beginPath();
    ctx.arc(f.x,f.y,r+15,-Math.PI/2,-Math.PI/2+prog*Math.PI*2); ctx.stroke();
  }
  ctx.globalAlpha=1; return true;
}

function reset(){
  fingers.clear(); winners=[]; state='idle'; resetAt=0; tapToReset=false;
  modeBtn.disabled=dareBtn.disabled=false; card.className='';
}
function frame(now){
  if(state==='counting'&&now>=deadline)choose(now);
  if(state==='chosen'&&resetAt&&now>=resetAt){
    reset();
  }
  ctx.fillStyle=BG; ctx.fillRect(0,0,W,H);
  if(state==='chosen'&&winners.length){
    const t=easeOut(Math.min(1,(now-chosenAt)/(reduce?1:560))), w=winners[0];
    ctx.fillStyle=w.color;
    disc(w.x,w.y,Math.hypot(Math.max(w.x,W-w.x),Math.max(w.y,H-w.y))*t); ctx.fill();
    ctx.fillStyle=BG;
    for(const v of winners){disc(v.x,v.y,(R*1.15+30)*t);ctx.fill()}
  }
  for(const [id,f] of fingers){f.id=id;drawFinger(f,now)}
  hint.style.opacity=fingers.size?0:1;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
